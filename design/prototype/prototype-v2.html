.sm-demo{padding:16px;background:var(--canvas);display:flex;flex-direction:column;gap:var(--space-1);max-width:390px;box-sizing:border-box}
.sm-demo.light{background:var(--surface)}
.sm-row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:16px}
.sm-btn-reset{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
:where(.sm-iconbtn,.sm-seg button,.sm-date,.sm-nav button,.sm-plan,.sm-card[role=button]):focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.sm-nav button:focus-visible{outline-color:var(--focus-ring)}
.sm-icon{display:block;flex:none}
.sm-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--radius-pill);border:0;cursor:pointer;flex:none;transition:background .2s ease-out}
.sm-iconbtn.sm-lg{width:56px;height:56px}
.sm-iconbtn.sm-sm{width:36px;height:36px}
.sm-iconbtn.soft{background:var(--surface-soft);color:var(--ink)}
.sm-iconbtn.soft:active{background:#e0e0db}
.sm-iconbtn.dark{background:var(--accent);color:var(--on-ink)}
.sm-iconbtn.dark:active{background:#225577}
.sm-iconbtn.light{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sm-iconbtn.outline{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sm-chip{font-weight:500;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 var(--space-4);border-radius:var(--radius-pill);font-size:14px;line-height:18px;white-space:nowrap;box-sizing:border-box}
.sm-chip.soft{background:var(--surface-soft);color:var(--ink)}
.sm-chip.light{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sm-chip.dark{background:var(--ink);color:var(--on-ink);height:48px;padding:0 var(--space-6)}
.sm-chip .sm-pos{color:var(--accent)} .sm-chip .sm-neg{color:var(--ink)}
.sm-seg{display:inline-flex;padding:3px;border-radius:var(--radius-pill);background:var(--accent);gap:0}
.sm-seg button{font:inherit;font-weight:500;font-size:14px;line-height:18px;border:0;border-radius:var(--radius-pill);padding:7px 18px;background:none;color:var(--on-ink);cursor:pointer;transition:background .2s ease-out,color .2s ease-out}
.sm-seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.sm-avatars{display:inline-flex;align-items:center}
.sm-avatar{width:44px;height:44px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;box-shadow:0 0 0 2px var(--surface);color:var(--ink);flex:none}
.sm-avatars .sm-avatar+.sm-avatar{margin-left:-10px}
.sm-avatar.sm-lg{width:64px;height:64px;font-size:18px}
.sm-avatar.t-sunflower{background:var(--butter)} .sm-avatar.t-sky{background:var(--powder)} .sm-avatar.t-butter{background:var(--butter-soft)} .sm-avatar.t-soft{background:var(--surface-soft)}
.sm-avatar.t-coral{background:var(--powder-deep);color:var(--ink)} .sm-avatar.t-ink{background:var(--ink);color:var(--on-ink)}
.sm-header{background:var(--powder-deep);color:var(--ink);border-radius:var(--radius-xl);padding:var(--space-5) var(--space-4) var(--space-5)}
.sm-header-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.sm-month{font:inherit;color:inherit;background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:8px;font-size:34px;line-height:38px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.sm-dates{display:flex;justify-content:space-between;margin-top:var(--space-4)}
.sm-date{font:inherit;color:var(--ink);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;width:48px;border-radius:var(--radius-pill);cursor:pointer}
.sm-date .d{font-size:18px;line-height:22px;font-weight:600}
.sm-date .w{font-size:12px;line-height:16px}
.sm-date[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.sm-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-5)}
.sm-hero .eyebrow{font-size:14px;line-height:18px;margin:var(--space-6) 0 var(--space-2)}
.sm-hero h1{margin:0;font-size:44px;line-height:46px;font-weight:400;letter-spacing:-.02em}
.sm-hero h1 strong{font-weight:600}
.sm-hero-stats{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-5);flex-wrap:wrap}
.sm-hero-stats .sm-iconbtn{margin-left:auto}
.sm-card{border-radius:var(--radius-xl);padding:var(--space-5);color:var(--ink);box-sizing:border-box}
.sm-card.surface{box-shadow:inset 0 0 0 1px var(--line)}
.sm-card.surface{background:var(--surface)} .sm-card.sunflower{background:var(--butter)} .sm-card.butter{background:var(--butter-soft)} .sm-card.sky{background:var(--powder)} .sm-card.soft{background:var(--surface-soft)}
.sm-highlight{display:flex;align-items:center;gap:var(--space-3);min-height:104px}
.sm-highlight .txt{flex:1;min-width:0}
.sm-highlight .t{font-size:18px;line-height:22px;font-weight:500;margin:0}
.sm-highlight .s{font-size:15px;line-height:20px;margin:4px 0 0}
.sm-card.butter .s{color:var(--ink-muted)}
.sm-task .top{display:flex;justify-content:space-between;gap:var(--space-3);align-items:flex-start}
.sm-task .time{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 6px}
.sm-task .t{font-size:24px;line-height:28px;font-weight:600;margin:0}
.sm-task .s{font-size:15px;line-height:20px;color:var(--ink-muted);margin:var(--space-2) 0 0}
.sm-task .foot{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-6)}
.sm-task .foot .sm-iconbtn{margin-left:auto}
.sm-progress .head{display:flex;justify-content:space-between;align-items:center}
.sm-progress .body{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-3);margin-top:var(--space-5)}
.sm-progress .l{font-size:14px;line-height:18px;margin:0 0 4px}

.hs-widget{font:inherit;text-align:left;border:0;cursor:pointer;background:var(--butter);color:var(--ink);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.hs-widget:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.w-top{display:flex;align-items:center;justify-content:space-between}
.w-name{font-size:20px;font-weight:600}
.w-value{font-size:36px;line-height:40px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.w-label{font-size:13px;color:#6b6350}
.w-bars{display:flex;gap:4px;height:8px;margin-top:6px}
.w-bar{flex-basis:0;border-radius:999px;background:var(--tone);min-width:8px}
.hs-note{margin:0 8px;font-size:13px;line-height:18px;color:var(--ink-muted)}
.ob-dots{display:flex;gap:6px;justify-content:center;padding:14px 0 6px}
.ob-dots span{width:7px;height:7px;border-radius:999px;background:var(--line)}
.ob-dots span.on{background:var(--ink);width:22px}
.onboard .sm-card.surface{padding:var(--space-5)}
.add-row{margin-top:8px}
.empty-bars{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.empty-bars span{height:10px;border-radius:999px;background:var(--chart-track)}
.empty-bars span:nth-child(2){width:70%}
.empty-bars span:nth-child(3){width:45%}

.home{display:flex;flex-direction:column;padding:4px 4px 8px}
.home-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 8px 16px}
.home-head .hi{margin:0;font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.home-head .hi-sub{margin:4px 0 0;font-size:13px;line-height:18px;color:var(--ink-muted)}
.home-head .home-greet{min-width:0}
.home-head .hi-date{margin:0;font-size:12px;line-height:18px;color:var(--ink-faint);white-space:nowrap}
.cta2{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;border:0;cursor:pointer;background:var(--butter);color:var(--ink);border-radius:var(--radius-xl);padding:20px;min-height:118px;box-sizing:border-box}
.cta2:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.cta2-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cta2-txt .t{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.cta2-txt .s{font-size:15px;line-height:20px;color:#6b6350}
.cta2-btn{width:60px;height:60px;border-radius:999px;background:var(--accent);color:var(--on-ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.group{margin-top:24px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 10px}
.sec-head h2{margin:0;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-muted)}
.sec-link{font:inherit;font-size:13px;font-weight:500;color:var(--accent);background:none;border:0;padding:4px;cursor:pointer}
.sec-link:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.money{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--radius-xl);padding:20px 20px 8px}
.money-hero{margin:0;font-size:42px;line-height:46px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.money-label{margin:2px 0 0;font-size:15px;line-height:20px;color:var(--ink-muted)}
.money-sub{margin:12px 0 0;font-size:13px;line-height:18px;color:var(--ink-faint)}
.money-bars{display:flex;flex-direction:column;gap:0;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.mb{font:inherit;color:inherit;display:flex;align-items:center;gap:12px;border:0;background:none;padding:6px 0;cursor:pointer;font-size:14px;line-height:18px;text-align:left;border-radius:6px}
.mb .n{width:84px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-muted)}
.mb .bar{flex:1;height:10px;border-radius:999px;background:var(--chart-track);overflow:hidden}
.mb .fill{display:block;height:100%;border-radius:999px;background:var(--tone)}
.mb .p{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.mb[aria-pressed=true] .n,.mb[aria-pressed=true] .p{color:var(--ink);font-weight:600}
.mb:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.money-note{margin:10px 0 0;font-size:13px;line-height:18px;color:var(--ink-muted)}
.money-link{font:inherit;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--accent);background:none;border:0;padding:14px 0 10px;margin-top:4px;cursor:pointer;border-top:1px solid var(--line);width:100%;justify-content:center}
.money-link:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.home .cues{display:flex;flex-direction:column;gap:8px}
.home-foot{margin:28px 8px 0;font-size:13px;line-height:18px;color:var(--ink-faint)}
.scroll{padding:4px 12px 24px}
.stack{gap:8px}

.drop{margin-top:18px}
.drop-bar{display:flex;gap:4px;height:16px;border-radius:999px;overflow:hidden}
.drop-bar .keep{flex-basis:0;background:var(--accent-soft);border-radius:999px}
.drop-bar .gone{flex-basis:0;background:var(--butter);border-radius:999px;box-shadow:inset 0 0 0 1.5px #d8ab3a}
.drop-key{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;line-height:18px;color:var(--ink-muted)}
.drop-key span{display:inline-flex;align-items:center;gap:6px}
.drop-key .k{width:10px;height:10px;border-radius:999px;display:inline-block}
.drop-key .k.keep{background:var(--accent-soft)} .drop-key .k.gone{background:var(--butter);box-shadow:inset 0 0 0 1.5px #d8ab3a}
.sticky-add{position:sticky;bottom:0;z-index:5;padding:12px 0 6px;margin-top:8px;background:linear-gradient(180deg,rgba(242,242,239,0),var(--canvas) 40%)}
.appbar-note{margin:12px 0 0;font-size:13px;line-height:18px;color:var(--ink-muted)}
.exits{margin-top:20px}
.exits .sm-button{height:58px;font-size:16px;box-shadow:0 6px 18px rgba(29,111,184,.25)}
