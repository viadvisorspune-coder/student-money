<!doctype html>
<html>
<head><meta charset="utf-8"><title>BarList — preview</title></head>
<body style="background:var(--canvas)">
<div id="root"></div>
<script>
  var SM = window.StudentMoney, h = React.createElement;
  function Demo(){ var s = React.useState(null);
    var rows=[['eat','Eating',3860,'coral'],['shop','Shopping',2130,'ink'],['travel','Travel',1400,'sky'],['ess','Essentials',749,'grey'],['goka','Gokhaana',340,'butter'],['subs','Subscriptions',318,'sunflower'],['store','7-Eleven',260,'blush']];
    return h('div',{className:'sm-demo'},h('section',{className:'sm-projection'},h('p',{className:'sm-eyebrow'},'Where it went this month'),
      h(SM.BarList,{onDark:true,selected:s[0],onSelect:s[1],items:rows.map(function(r){return {id:r[0],label:r[1],value:r[2],tone:r[3],display:SM.formatINR(r[2])};})}))); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
